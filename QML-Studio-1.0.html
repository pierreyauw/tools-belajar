function qmlTokens(source){const tokens=[];let i=0,line=0;const fail=s=>{throw Error('Baris '+(line+1)+': '+s);};while(i<source.length){const c=source[i];if(/\s/.test(c)){if(c==='\n')line++;i++;continue;}if(source.startsWith('//',i)){while(i<source.length&&source[i]!=='\n')i++;continue;}if(source.startsWith('/*',i)){i+=2;while(i<source.length&&!source.startsWith('*/',i)){if(source[i]==='\n')line++;i++;}if(i===source.length)fail('Komentar belum ditutup.');i+=2;continue;}const start=i,startLine=line;if('"\'`'.includes(c)){i++;let closed=false;while(i<source.length){if(source[i]==='\\'){i+=2;continue;}if(source[i]==='\n')line++;if(source[i++]===c){closed=true;break;}}if(!closed)fail('Teks belum ditutup.');tokens.push({v:source.slice(start,i),start,end:i,line:startLine,kind:'string'});continue;}

function parseQml(source){const {tokens:t,pairs}=qmlTokens(source);const raw=(a,b)=>source.slice(t[a].start,t[b].end);function object(type,open){const close=pairs.get(open),members=[];let i=open+1;while(i<close){if(t[i].v===';'){i++;continue;}const begin=i;let colon=-1,brace=-1,j=i;while(j<close){if(t[j].v===':'){colon=j;break;}if(t[j].v==='{'){brace=j;break;}if(t[j].v===';'||(j>begin&&t[j].line>t[j-1].line)){break;}if(['(','['].includes(t[j].v)){j=pairs.get(j)+1;continue;}j++;}

if(j===begin)j++;members.push({kind:'opaque',key:raw(begin,j-1),raw:raw(begin,j-1),start:t[begin].start,end:t[j-1].end,line:t[begin].line});i=j;}

function jsIssues(sources=jsSources()){
 const issues=[],ids=new Set(['root',...project.nodes.map(n=>n.id)]),known=new Set(['console','Math','JSON','Qt','Number','String','Object','Array','Date','Boolean',...Object.keys(jsData().files)]);
 const declared=new Set();for(const s of sources)for(const m of s.code.matchAll(/\b(?:var|let|const|function)\s+(\w+)|\bid\s*:\s*(\w+)/g))declared.add(m[1]||m[2]);
 for(const s of sources){if(!s.code.trim())continue;const lines=s.code.split('\n');lines.forEach((line,i)=>{
 const add=(kind,text)=>issues.push({source:s.name,line:i+1,kind,text});
 for(const m of line.matchAll(/\b([A-Za-z_]\w*)\.([A-Za-z_]\w*)/g)){const[id,prop]=[m[1],m[2]];if(!ids.has(id)&&!known.has(id)&&!declared.has(id)&&!['parent','event','mouse','key','modelData'].includes(id))add('referensi','Periksa referensi '+id+' (analisis sederhana; mungkin parameter atau objek lokal).');const n=get(id);if(n?.bindings[prop]&&new RegExp('\\b'+id+'\\.'+prop+'\\s*=(?!=)').test(line))add('binding',id+'.'+prop+' ditugaskan langsung; binding dapat terputus.');}
 if(/\b(?:width|height|x|y|value|opacity)\s*=\s*["']/.test(line))add('tipe','Properti angka menerima literal teks.');
 if(/\b(?:visible|enabled|checked)\s*=\s*["']/.test(line))add('tipe','Properti boolean menerima literal teks.');
 if(/\b(document|window|localStorage|fetch|setTimeout|setInterval)\b/.test(line))add('dukungan','API browser ini tidak langsung tersedia dalam JavaScript QML.');
 if(/\b(Timer|Connections|State|Transition|MouseArea|Keys|XMLHttpRequest)\b/.test(line))add('dukungan','Bagian ini perlu pemeriksaan di Qt; tidak dieksekusi sebagai QML oleh browser.');
 });if(!s.name.endsWith('.qml')&&!s.name.endsWith('.js'))try{new Function(s.name.endsWith('(binding)')?'return ('+s.code+')':s.code);}catch(e){issues.push({source:s.name,line:'?',kind:'sintaks',text:e.message});}}
 return issues;
}
function jsExplain(code){return code.split('\n').map((line,i)=>{let text='Ekspresi JavaScript; periksa fungsi dan objek yang dipanggil.';const t=line.trim();if(!t)text='Baris kosong.';else if(t.startsWith('//'))text='Komentar untuk pembaca kode.';else if(/^if\b/.test(t))text='Jalankan bagian berikut hanya jika kondisi benar.';else if(/^else\b/.test(t))text='Jalur alternatif jika kondisi sebelumnya salah.';else if(/^for\b|^while\b/.test(t))text='Ulangi blok selama syarat perulangan terpenuhi.';else if(/^return\b/.test(t))text='Akhiri fungsi/event dan kembalikan nilai bila ada.';else if(/console\.log/.test(t))text='Tulis nilai ke konsol untuk pemeriksaan.';else if(/\bfunction\b/.test(t))text='Definisikan fungsi dengan parameter yang dapat dipakai ulang.';else if(/\+\+/.test(t))text='Tambahkan satu ke nilai saat ini.';else if(/^[\w.]+\s*=\s*!/.test(t))text='Balik nilai benar/salah dan simpan hasilnya.';else if(/^[\w.]+\s*=/.test(t))text='Hitung sisi kanan, lalu simpan ke properti di sisi kiri.';else if(/^[{};]+$/.test(t))text='Batas blok atau akhir pernyataan.';return {line:i+1,code:line,text};});}

function jsAsyncQml(timer){const scripts=jsData().simulation||{};return `property string statusProses: "siap"
property bool simulasiGagal: false
Timer {
    id: ${timer}
    interval: 1500
    onTriggered: {
        root.statusProses = root.simulasiGagal ? "gagal" : "berhasil"

            ${scripts.failure||'console.log("gagal");'}
        } else {
            ${scripts.success||'console.log("berhasil");'}
        }
    }
}
function mulaiProses() {

function beforeAfter(){if(!past.length){tell('Belum ada perubahan untuk dibandingkan.');return;}const previous=JSON.parse(past.at(-1));modal('Sebelum → sesudah',`<table><tr><th>Objek</th><th>Properti</th><th>Sebelum</th><th>Sesudah</th></tr>${project.nodes.flatMap(n=>{const old=previous.nodes.find(a=>a.id===n.id);return old?['x','y','w','h','parent','anchor','text','color'].filter(k=>old[k]!==n[k]).map(k=>`<tr><td>${esc(n.id)}</td><td>${k}</td><td>${esc(old[k])}</td><td>${esc(n[k])}</td></tr>`):[`<tr><td>${esc(n.id)}</td><td colspan="3">Objek baru</td></tr>`];}).join('')||'<tr><td colspan="4">Tidak ada perubahan pada properti utama.</td></tr>'}</table>`);}
function perform(action){const n=current();const simple={duplicate:()=>transact(()=>insertNodes(copyNodes(selection),n?.parent||'root')),delete:deleteSelected,group:groupSelection,why,calculator,actionBuilder,editSupported,explainLines,compareObjects,dependencies,beforeAfter,scenario:runInteractionScenario,scenarioCustom:openScenarioEditor};if(simple[action]){simple[action]();return;}switch(action){case 'ungroup':transact(()=>{if(!n||!CONTAINERS.includes(n.type))return;for(const child of children(n.id))reparent(child.id,n.parent);project.nodes=project.nodes.filter(a=>a.id!==n.id);selection=[];});break;case 'front':case 'back':transact(()=>{const selected=project.nodes.filter(a=>selection.includes(a.id)),others=project.nodes.filter(a=>!selection.includes(a.id));project.nodes=action==='front'?[...others,...selected]:[...selected,...others];});break;case 'center':transact(()=>{const g=geom[n.id],p=geom[n.parent];Object.assign(n,{anchor:'free',relative:'',x:(p.w-g.w)/2,y:(p.h-g.h)/2});});break;case 'origin':transact(()=>Object.assign(n,{anchor:'free',relative:'',x:0,y:0}));break;case 'overlap':{if(!n)return;const g=geom[n.id],cx=g.gx+g.w/2,cy=g.gy+g.h/2;const nodes=project.nodes.filter(a=>{const b=geom[a.id];return b.gx<=cx&&b.gy<=cy&&b.gx+b.w>=cx&&b.gy+b.h>=cy;});modal('Objek di titik tengah pilihan',nodes.map(a=>`<button data-pick="${a.id}">${esc(a.id)} · ${a.type}</button>`).join(' '));break;}case 'variables':try{const vars=JSON.parse($('variables').value);transact(()=>{project.variables=vars;validate(project);});}catch(e){tell(e.message);}break;case 'applyEvent':transact(()=>{n.events[activeEvent]=$('eventCode').value;});break;case 'applyFunctions':transact(()=>{project.functions=$('functions').value;});break;case 'image':imageTarget=n.id;$('imageFile').click();break;case 'reference':imageTarget='reference';$('imageFile').click();break;case 'clearReference':transact(()=>project.reference='');break;case 'naturalSize':if(project.assets[n.source])transact(()=>{n.w=Math.min(4000,project.assets[n.source].w);n.h=Math.min(4000,project.assets[n.source].h);n.ratio=true;});break;case 'addPage':askText('Tambah halaman','Nama','Halaman '+(project.pages.length+1),name=>transact(()=>{project.pages.push(name);project.page=project.pages.length-1;selection=[];}));break;case 'renamePage':askText('Nama halaman','Nama',project.pages[project.page],name=>transact(()=>project.pages[project.page]=name));break;case 'saveComponent':if(n)askText('Simpan komponen','Nama komponen',n.id,name=>{library.push({name,nodes:copyNodes(selection),fonts:clone(project.fonts||{})});autosave();renderLeft();});break;case 'saveVersion':askText('Simpan versi','Nama versi','Versi '+(versions.length+1),name=>{versions.push({name,time:new Date().toLocaleString(),project:clone(project)});if(versions.length>12)versions.shift();autosave();renderBottom();});break;case 'recover':try{const saved=localStorage.getItem('qml-studio-v2');if(saved)transact(()=>project=validate(JSON.parse(saved)));else tell('Belum ada autosave.');}catch(e){tell(e.message);}break;case 'copyCode':copyQmlText();break;case 'downloadQml':download(exportQml({inlineAssets:true}),'Design.qml');break;case 'selectedQml':if(selection.length){download(exportQml({inlineAssets:true,only:selection}),'Komponen.qml');tell('Pilihan diekspor. Acuan ke objek di luar pilihan harus disertakan sendiri.');}break;case 'lint':renderBottom();tell('Pemeriksaan model selesai. Gunakan skrip Qt untuk qmllint asli.');break;case 'report':importReport();break;case 'clearLogs':logs=[];renderBottom();break;case 'showRuntime':modal('Nilai runtime',`<textarea class="code" readonly>${esc(JSON.stringify(runtime||{},null,2))}</textarea>`);break;case 'exerciseRight':transact(()=>{project=initial();project.pw=800;project.ph=500;project.nodes[0].x=50;project.nodes[0].w=200;selection=[project.nodes[0].id];exercise={kind:'right',id:selection[0]};});tell('Latihan: letakkan kotak 20 px dari kanan parent. Coba hitung x.');break;case 'exerciseRepair':loadTemplate('layout');transact(()=>{const p=get('kolom');p.type='Item';children(p.id).forEach((a,i)=>{a.x=20+i*30;a.y=10+i*20;});exercise={kind:'repair',id:p.id};});tell('Latihan: ubah parent kolom menjadi Column agar tiga kartu tersusun tanpa bertumpuk.');break;case 'checkExercise':{if(!exercise){tell('Mulai latihan dahulu.');break;}geometry();const g=geom[exercise.id];const passed=exercise.kind==='right'?Math.abs(project.pw-g.x-g.w-20)<.1:get(exercise.id)?.type==='Column';tell(passed?'Latihan selesai — hasil benar.':'Belum tepat. Periksa parent, ukuran, dan jarak tepinya.');if($('exerciseStatus'))$('exerciseStatus').textContent=passed?'✓ Benar':'Coba lagi';break;}}}
async function importReport(){const el=document.createElement('input');el.type='file';el.accept='.json';el.onchange=async()=>{try{const r=JSON.parse((await el.files[0].text()).replace(/^\uFEFF/,''));const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(exportQml())))).map(x=>x.toString(16).padStart(2,'0')).join('');const testHash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(testQml())))).map(x=>x.toString(16).padStart(2,'0')).join('');if(r.schema!==1||r.sha256!==hash||r.testSha256!==testHash)throw Error('Laporan tidak cocok dengan kode saat ini. Ekspor dan periksa ulang.');report=r;$('qtReport').innerHTML=`<div class="explain">Laporan lokal: qmllint ${r.lintPassed?'lolos':'gagal'} · smoke test ${r.smokePassed?'lolos':'gagal'} · interaksi ${r.interactionPassed?'lolos menurut laporan':'belum diuji'}.<br>${esc(r.date)} · ${esc(r.qtBin)}</div><details><summary>Rincian</summary><pre style="white-space:pre-wrap">${esc(r.details)}</pre></details>`;}catch(e){tell(e.message);}};el.click();}
async function importImage(file,target){if(!file)return;try{if(file.size>8*1024*1024)throw Error('Gambar maksimal 8 MB.');if(!['image/png','image/jpeg','image/webp','image/svg+xml'].includes(file.type))throw Error('Gunakan PNG, JPG, WebP, atau SVG.');let source=file;if(file.type==='image/svg+xml'){const doc=new DOMParser().parseFromString(await file.text(),'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG tidak valid.');doc.querySelectorAll('script,foreignObject,iframe,object,embed,style').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes])if(/^on/i.test(a.name)||(/href|src/.test(a.name)&&!a.value.startsWith('#'))||/url\(/i.test(a.value))n.removeAttribute(a.name);});source=new Blob([new XMLSerializer().serializeToString(doc)],{type:'image/svg+xml'});}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(source);});const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('Gambar tidak dapat dibaca.'));image.src=data;});let name=file.name.replace(/[^A-Za-z0-9_.-]/g,'_');if(!name||name.startsWith('.'))name='gambar_'+Date.now()+'.'+(file.type==='image/svg+xml'?'svg':file.type.split('/')[1]);while(project.assets[name])name='copy_'+name;transact(()=>{project.assets[name]={data,w:image.naturalWidth,h:image.naturalHeight};if(target==='reference')project.reference=name;else{let n=get(target);if(!n){n=baseNode('Image',uid('image'));n.page=project.page;project.nodes.push(n);}n.source=name;n.ratio=true;if(!target){n.w=Math.min(400,image.naturalWidth);n.h=Math.max(1,Math.round(n.w*image.naturalHeight/image.naturalWidth));}selection=[n.id];}});tell('Gambar ditambahkan: '+name);}catch(e){tell(e.message);}}
$('imageFile').onchange=e=>{importImage(e.target.files[0],imageTarget);e.target.value='';};$('viewport').addEventListener('dragover',e=>e.preventDefault());$('viewport').addEventListener('drop',e=>{e.preventDefault();if(mode==='design')importImage(e.dataTransfer.files[0],null);});
$('save').onclick=()=>download(JSON.stringify(project,null,2),'proyek-qml.json','application/json');$('load').onclick=()=>$('openFile').click();$('openFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>30000000)throw Error('Proyek maksimal 30 MB.');const p=JSON.parse(await f.text());if(p.name&&Array.isArray(p.nodes)&&!p.version){const test={...initial(),nodes:p.nodes,fonts:p.fonts||{}};validate(test);library.push(p);autosave();tell('Komponen ditambahkan ke Pustaka.');renderLeft();}else transact(()=>{project=validate(p);selection=[];});}catch(e){tell('Gagal membuka: '+e.message);}finally{e.target.value='';}};
$('javascriptMenu').onclick=()=>jsOpen();$('undo').onclick=undo;$('redo').onclick=redo;$('export').onclick=exportPackage;$('designMode').onclick=()=>stopPreview();$('stopMode').onclick=()=>stopPreview();$('tryMode').onclick=startPreview;$('modalClose').onclick=()=>{clearTimeout(qmlLiveTimer);$('modal').close();$('modalContent').onclick=null;};$('modal').addEventListener('close',()=>clearTimeout(qmlLiveTimer));$('zoom').onchange=renderStage;for(const id of ['grid','snap','guides','wire','ghost','animate','longText'])$(id).onchange=renderStage;$('clean').onclick=()=>{clean=!clean;$('clean').classList.toggle('active',clean);renderStage();};$('compareView').onclick=()=>{compare=!compare;$('compareView').classList.toggle('active',compare);$('compareArea').hidden=!compare;renderStage();};$('measure').onclick=()=>{measuring=!measuring;measurePts=[];$('measure').classList.toggle('active',measuring);renderStage();};
try{const data=localStorage.getItem('qml-studio-v2');if(data){project=validate(JSON.parse(data));selection=project.nodes.slice(0,1).map(n=>n.id);tell('Proyek dipulihkan dari autosave browser.');}const lib=JSON.parse(localStorage.getItem('qml-studio-library')||'[]');library=Array.isArray(lib)?lib:[];const hist=JSON.parse(localStorage.getItem('qml-studio-versions')||'[]');versions=Array.isArray(hist)?hist:[];}catch{tell('Autosave lama tidak terbaca. Mulai proyek baru atau buka JSON.');}
new ResizeObserver(()=>renderStage()).observe($('viewport'));render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_qml_design',description:'Read current generated QML and object count.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('Expected empty input.');return {qml:exportQml(),objectCount:project.nodes.length};}})).catch(()=>{});}catch{}}
